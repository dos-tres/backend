name: Backend checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dos_tres_test
          POSTGRES_DB: dos_tres_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dos_tres_test -d dos_tres_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Disposable isolated CI service; never use trust authentication in deployment.
      TEST_DATABASE_URL: postgresql+psycopg://dos_tres_test@127.0.0.1:5432/dos_tres_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m pip check
