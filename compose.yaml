services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: dos_tres
      POSTGRES_DB: dos_tres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U dos_tres -d dos_tres"]
      interval: 2s
      timeout: 3s
      retries: 30
  db-test:
    image: postgres:17
    profiles: [test]
    environment:
      POSTGRES_USER: dos_tres_test
      POSTGRES_DB: dos_tres_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Set POSTGRES_TEST_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U dos_tres_test -d dos_tres_test"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
